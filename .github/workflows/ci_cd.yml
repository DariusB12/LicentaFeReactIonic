name: Build and Push Docker Image
on:
  push:
    branches:
      - main

jobs:
  deploy-docker-image:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo into the runner
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t licenta_frontend:latest .

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push Docker image
        run: |
          docker tag licenta_frontend:latest ${{ secrets.DOCKERHUB_USERNAME }}/licenta_frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/licenta_frontend:latest

      - name: Confirm deployment completion
        run: echo "Deployment completed!"